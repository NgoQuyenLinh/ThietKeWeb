     <title>Trang web dau tien</title>

<style>

.breadcrumb {
    list-style: none;
    display: flex;
    gap: 15px;
}

.breadcrumb li:not(:last-child)::after {
    content: "/";
    margin-left: 15px;
}

</style>

</head>

<body>

<ul class="breadcrumb">

    <li><a href="#">Điện Tử</a></li>

    <li><a href="#">Máy tính</a></li>

    <li><a href="#">Laptop</a></li>

    <li><a href="#">Dell</a></li>
</ul>
</body>

</html>
