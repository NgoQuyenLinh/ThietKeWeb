<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh điều hướng Header</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <nav class="top-navbar">
                <div class="navbar-left">
                    <span>Kết nối</span>
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>

                <!-- Phần được khoanh khung xanh bên phải -->
                <ul class="navbar-right">
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fa-regular fa-bell"></i> Thông Báo
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fa-regular fa-circle-question"></i> Hỗ Trợ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fa-solid fa-globe"></i> Tiếng Việt <i class="fa-solid fa-chevron-down icon-small"></i>
                        </a>
                    </li>
                    <li class="nav-item nav-item--strong nav-item--separate">
                        <a href="#" class="nav-link">Đăng Ký</a>
                    </li>
                    <li class="nav-item nav-item--strong">
                        <a href="#" class="nav-link">Đăng Nhập</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

</body>
</html>
