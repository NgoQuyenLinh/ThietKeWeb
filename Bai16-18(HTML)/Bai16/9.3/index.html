<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breadcrumb Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Điện Tử</a></li>
            <li class="breadcrumb-item"><a href="#">Máy tính</a></li>
            <li class="breadcrumb-item"><a href="#">Laptop</a></li>
            <li class="breadcrumb-item active" aria-current="page"><a href="#">Dell</a></li>
        </ol>
    </nav>

</body>
</html>
